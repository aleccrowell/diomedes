name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  # one run per branch; a newer push cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['1.13']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # Fast, offline suite. Slow (NUTS) and network tests are opt-in via
      # DIOMEDES_SLOW_TESTS / DIOMEDES_NETWORK_TESTS and are not run here.
      - uses: julia-actions/julia-runtest@v1

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # deploydocs (docs/deploy.jl) pushes the built site to gh-pages (GitHub Pages,
    # #45): master updates /dev, a version tag /stable; other branches skip it
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      # docs/Project.toml takes Diomedes from the checkout ([sources]). The build
      # fails on an exported name without a docstring, a broken cross-reference
      # or a failing doctest.
      - run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=docs docs/make.jl
      # Every figure must render from the built pages with their own scripts
      # (RequireJS, Vega from the CDN) before the site is published (#56).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix docs/test
      - name: Check that the figures render
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory docs/build &
          sleep 2
          NODE_PATH=docs/test/node_modules node docs/test/render_figures.js http://127.0.0.1:8765/ docs/build
      - run: julia --project=docs docs/deploy.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

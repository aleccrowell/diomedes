name: Release

# Tag and release when a tested commit on master carries a new version.
# Bump `version` in Project.toml in a PR; once CI passes on the merge commit,
# this creates tag vX.Y.Z on that commit and a GitHub Release with notes
# generated from the merged PRs. A version that is already tagged is skipped.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Release new version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Project.toml)
          [ -n "$version" ] || { echo "no version in Project.toml"; exit 1; }
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already released"
            exit 0
          fi
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes

name: Slow tests

# The opt-in groups the per-push CI skips: NUTS recovery fits on simulated data
# (DIOMEDES_SLOW_TESTS) and the live APIs (DIOMEDES_NETWORK_TESTS). Weekly, so
# upstream API changes show up, and on demand from the Actions tab.
# GitHub-hosted runners are free for public repositories.

on:
  schedule:
    - cron: '0 6 * * 1'       # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  test:
    name: Slow + network tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          DIOMEDES_SLOW_TESTS: '1'
          DIOMEDES_NETWORK_TESTS: '1'
